<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DCT — Problem Database</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="firebase-sync.js" defer></script>
  <script src="db-viewer.js" defer></script>
  <style>
    :root {
      --bg:     #060a10;
      --bg2:    #0c1420;
      --bg3:    #101c2e;
      --border: #1a3050;
      --border2:#0e4a7a;
      --neon:   #00d4ff;
      --green:  #00ff88;
      --red:    #ff4060;
      --mid:    #ffd060;
      --easy:   #00e5a0;
      --expert: #cc88ff;
      --text:   #e1effa;
      --dim:    #7da2c4;
      --mute:   #4a6880;
      --glow:   0 0 10px rgba(0,212,255,0.3);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      min-height: 100vh;
    }

    body::before {
      content:'';
      position:fixed; inset:0;
      background-image:
        linear-gradient(rgba(0,212,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.025) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events:none; z-index:0;
    }

    .page { position:relative; z-index:1; max-width: 960px; margin:0 auto; padding: 24px 20px 40px; }

    /* ── HEADER ── */
    .header {
      display:flex; align-items:center; justify-content:space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      gap: 12px; flex-wrap: wrap;
    }
    .header-left { display:flex; align-items:center; gap:14px; }
    .header-icon {
      width: 38px; height: 38px;
      filter: drop-shadow(0 0 8px rgba(0,212,255,0.5));
    }
    .header-title {
      font-family:'Orbitron', sans-serif;
      font-weight:900; font-size:22px; letter-spacing:5px;
      color:#fff;
      text-shadow: 0 0 18px var(--neon);
    }
    .header-sub {
      font-family:'Share Tech Mono', monospace;
      font-size:9px; letter-spacing:3px; color:var(--neon); opacity:0.85;
      margin-top:3px;
    }
    .header-back {
      font-family:'Share Tech Mono', monospace;
      font-size:10px; letter-spacing:1px;
      color:var(--dim);
      background:none; border:1px solid var(--border);
      border-radius:5px; padding:6px 12px;
      cursor:pointer; transition:all 0.2s;
    }
    .header-back:hover { color:var(--neon); border-color:var(--border2); box-shadow:var(--glow); }

    /* ── STATS ROW ── */
    .stats-row {
      display:grid; grid-template-columns:repeat(4,1fr);
      gap:8px; margin-bottom:20px;
    }
    @media(max-width:600px){ .stats-row{ grid-template-columns:1fr 1fr; } }

    .stat-card {
      background:var(--bg2);
      border:1px solid var(--border);
      border-radius:8px;
      padding:12px 10px;
      text-align:center;
    }
    .stat-num {
      font-family:'Orbitron', monospace;
      font-size:24px; font-weight:700;
      color:var(--neon);
      text-shadow:var(--glow);
      line-height:1;
    }
    .stat-lbl {
      font-family:'Share Tech Mono', monospace;
      font-size:9px; letter-spacing:2px;
      color:var(--dim); margin-top:5px; text-transform:uppercase;
    }

    /* ── FILTERS ── */
    .filters-bar {
      display:flex; gap:8px; flex-wrap:wrap;
      margin-bottom:20px; align-items:center;
    }
    .filters-bar select,
    .filters-bar input {
      font-family:'Share Tech Mono', monospace;
      font-size:11px; letter-spacing:1px;
      padding:7px 10px;
      background:var(--bg2);
      border:1px solid var(--border);
      border-radius:5px;
      color:var(--text);
      cursor:pointer;
      transition: border-color 0.2s;
    }
    .filters-bar select:hover,
    .filters-bar input:hover { border-color:var(--border2); }
    .filters-bar select:focus,
    .filters-bar input:focus { outline:none; border-color:var(--neon); box-shadow:var(--glow); }
    .filters-bar input { min-width:200px; }
    .filter-count {
      font-family:'Share Tech Mono', monospace;
      font-size:10px; letter-spacing:1px; color:var(--dim);
      margin-left:auto;
    }

    /* ── PLATFORM LEGEND ── */
    .platform-legend {
      display:flex; gap:14px; flex-wrap:wrap;
      font-family:'Share Tech Mono', monospace;
      font-size:9px; letter-spacing:1px; color:var(--dim);
      margin-bottom:20px; align-items:center;
    }
    .leg-dot {
      display:inline-block; width:8px; height:8px;
      border-radius:50%; margin-right:5px;
    }

    /* ── DAY BLOCK ── */
    .day-block {
      background:var(--bg2);
      border:1px solid var(--border);
      border-radius:8px;
      margin-bottom:10px;
      overflow:hidden;
      transition:border-color 0.2s;
    }
    .day-block:hover { border-color:var(--border2); }

    .day-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:11px 14px;
      cursor:pointer;
      user-select:none;
      transition:background 0.2s;
      gap:10px;
    }
    .day-header:hover { background:var(--bg3); }

    .day-date {
      font-family:'Orbitron', monospace;
      font-size:12px; font-weight:700; letter-spacing:2px;
      color:var(--neon);
    }
    .day-meta { display:flex; align-items:center; gap:10px; }
    .count-pill {
      font-family:'Share Tech Mono', monospace;
      font-size:9px; letter-spacing:1.5px;
      padding:3px 9px; border-radius:3px;
      background:rgba(0,212,255,0.1);
      color:var(--neon); border:1px solid rgba(0,212,255,0.2);
    }
    .diff-pills { display:flex; gap:5px; }
    .mini-pill {
      font-family:'Share Tech Mono', monospace;
      font-size:8px; padding:2px 6px; border-radius:3px; letter-spacing:0.5px;
    }
    .mini-easy   { background:rgba(0,229,160,0.10); color:var(--easy);   border:1px solid rgba(0,229,160,0.2); }
    .mini-medium { background:rgba(255,208,96,0.10); color:var(--mid);   border:1px solid rgba(255,208,96,0.2); }
    .mini-hard   { background:rgba(255,64,96,0.10);  color:var(--red);   border:1px solid rgba(255,64,96,0.2); }
    .mini-expert { background:rgba(204,136,255,0.10);color:var(--expert);border:1px solid rgba(204,136,255,0.2);}

    .chevron {
      font-size:11px; color:var(--dim);
      transition:transform 0.25s;
      flex-shrink:0;
    }
    .chevron.open { transform:rotate(180deg); }

    /* ── TABLE ── */
    .day-body { border-top:1px solid var(--border); overflow-x:auto; }
    .day-body.hidden { display:none; }

    table {
      width:100%; border-collapse:collapse;
      font-size:11px;
    }
    thead th {
      font-family:'Share Tech Mono', monospace;
      font-size:9px; letter-spacing:2px; text-transform:uppercase;
      color:var(--dim); font-weight:400;
      padding:8px 12px;
      text-align:left;
      border-bottom:1px solid var(--border);
      white-space:nowrap;
    }
    tbody tr { transition:background 0.15s; }
    tbody tr:hover td { background:var(--bg3); }
    tbody td {
      padding:9px 12px;
      border-bottom:1px solid rgba(26,48,80,0.5);
      vertical-align:middle;
    }
    tbody tr:last-child td { border-bottom:none; }

    .num-cell { color:var(--dim); font-family:'Share Tech Mono',monospace; width:32px; }

    .prob-link {
      color:var(--green);
      text-decoration:none;
      font-size:12px;
      text-shadow:0 0 6px rgba(0,255,136,0.2);
      transition:text-shadow 0.2s;
    }
    .prob-link:hover {
      text-decoration:underline;
      text-shadow:0 0 10px rgba(0,255,136,0.5);
    }

    .platform-cell {
      display:flex; align-items:center; gap:6px;
      font-family:'Share Tech Mono', monospace;
      font-size:9px; letter-spacing:1px; color:var(--dim);
      white-space:nowrap;
    }
    .plat-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }

    .diff-badge {
      font-family:'Share Tech Mono', monospace;
      font-size:9px; letter-spacing:0.5px;
      padding:2px 8px; border-radius:3px;
      text-transform:uppercase; white-space:nowrap;
    }
    .diff-easy   { background:rgba(0,229,160,0.12); color:var(--easy);   border:1px solid rgba(0,229,160,0.25); }
    .diff-medium { background:rgba(255,208,96,0.12); color:var(--mid);   border:1px solid rgba(255,208,96,0.25); }
    .diff-hard   { background:rgba(255,64,96,0.12);  color:var(--red);   border:1px solid rgba(255,64,96,0.25); }
    .diff-expert { background:rgba(204,136,255,0.12);color:var(--expert);border:1px solid rgba(204,136,255,0.25);}
    .diff-na     { background:rgba(74,104,128,0.12); color:var(--dim);   border:1px solid rgba(74,104,128,0.2); }

    .time-cell { color:var(--dim); font-family:'Share Tech Mono',monospace; font-size:10px; white-space:nowrap; }
    .taken-cell { color:var(--neon); font-family:'Share Tech Mono',monospace; font-size:10px; opacity:0.95; white-space:nowrap; }

    /* ── EMPTY / ERROR ── */
    .empty {
      text-align:center; padding:40px 20px;
      font-family:'Share Tech Mono', monospace;
      font-size:11px; letter-spacing:2px; color:var(--dim);
    }
    .empty-icon { font-size:36px; display:block; margin-bottom:14px; opacity:0.5; }

    /* ── FOOTER ── */
    .footer {
      margin-top:30px; padding-top:14px;
      border-top:1px solid var(--border);
      font-family:'Share Tech Mono', monospace;
      font-size:9px; letter-spacing:2px; color:var(--mute);
      display:flex; justify-content:space-between;
    }
  </style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <svg class="header-icon" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="34" height="34" rx="7" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="5 2"/>
        <path d="M11 14 L17 19 L11 24" stroke="#00d4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 24 H28" stroke="#00ff88" stroke-width="2" stroke-linecap="round"/>
        <circle cx="30" cy="9" r="3" fill="#00d4ff" opacity="0.55"/>
        <rect x="12" y="9" width="10" height="2" rx="1" fill="#00ff88" opacity="0.4"/>
      </svg>
      <div>
        <div class="header-title">DCT</div>
        <div class="header-sub">PROBLEM DATABASE · ALL PLATFORMS</div>
      </div>
    </div>
    <button class="header-back" id="btn-close">✕ CLOSE</button>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" id="s-total">—</div>
      <div class="stat-lbl">Total Solved</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="s-days">—</div>
      <div class="stat-lbl">Active Days</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="s-streak">—</div>
      <div class="stat-lbl">Current Streak 🔥</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="s-avg">—</div>
      <div class="stat-lbl">Daily Average</div>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="filters-bar">
    <select id="filter-platform">
      <option value="">All Platforms</option>
      <option value="leetcode">LeetCode</option>
      <option value="codeforces">Codeforces</option>
      <option value="codechef">CodeChef</option>
      <option value="hackerrank">HackerRank</option>
    </select>
    <select id="filter-diff">
      <option value="">All Difficulties</option>
      <option value="Easy">Easy</option>
      <option value="Medium">Medium</option>
      <option value="Hard">Hard</option>
      <option value="Expert">Expert</option>
    </select>
    <select id="filter-sort">
      <option value="newest">Newest First</option>
      <option value="oldest">Oldest First</option>
    </select>
    <input type="text" id="filter-search" placeholder="🔍  Search problem name..."/>
    <span class="filter-count" id="filter-count"></span>
  </div>

  <!-- LEGEND -->
  <div class="platform-legend">
    <span><span class="leg-dot" style="background:#f5a623"></span>LEETCODE</span>
    <span><span class="leg-dot" style="background:#4a90d9"></span>CODEFORCES</span>
    <span><span class="leg-dot" style="background:#9b6b3a"></span>CODECHEF</span>
    <span><span class="leg-dot" style="background:#00b388"></span>HACKERRANK</span>
  </div>

  <!-- DB CONTAINER -->
  <div id="db-container">
    <div class="empty"><span class="empty-icon">📡</span>LOADING DATABASE...</div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <span>DCT © 2025 · MANIFEST V3</span>
    <span id="footer-ts">—</span>
  </div>

</div>
</body>
</html>
